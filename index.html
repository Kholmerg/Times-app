  --bg:#f2f3ee;
  --surface:#ffffff;
  --ink:#18211d;
  --muted:#5b685f;
  --line:#dce1d8;
  --accent:#17614f;
  --accent-ink:#ffffff;
  --accent-soft:#e1eee8;
  --stop:#b0432a;
  --stop-soft:#f7e3dc;
  --warn:#8f6200;

  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){

    --bg:#111614; --surface:#19201d; --ink:#e6ebe7; --muted:#99a69e; --line:#2a3430;
    --accent:#4fb393; --accent-ink:#0b1410; --accent-soft:#1c3029;

}
:root[data-theme="dark"]{

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
.num,.tnum{font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}

.top .in>.pill{order:5;flex-basis:100%;justify-content:center}
.brand{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}

.top .sp{flex:1}

.wrap>*,.card>*{min-width:0}
body{overflow-x:hidden}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1.2}
h2{font-family:var(--font-display);font-weight:500;font-size:17px}
h3{font-size:15px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
label{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}

.field{display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.btn.stop{background:var(--stop);color:#fff;border-color:var(--stop)}

.btn.danger{color:var(--stop)}

.btn.big{width:100%;padding:18px;font-size:19px;border-radius:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.err{color:var(--stop);font-size:14px}

.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.stop{background:var(--stop-soft);color:var(--stop)}
.pill.grey{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.status{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}

@keyframes pulse{50%{box-shadow:0 0 0 7px transparent}}
.timer{font-family:var(--font-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:21px;font-variant-numeric:tabular-nums;font-weight:700;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav strong{font-family:var(--font-display);font-weight:500;font-size:16px}
.day{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.day:first-of-type{border-top:0;padding-top:0}
.shift{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.shift .t{flex:1}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .cnt{background:var(--stop);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
.tablewrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}

th{font-size:12px;color:var(--muted);font-weight:600}
tbody tr{cursor:pointer}

.list-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
.empty{color:var(--muted);text-align:center;padding:14px 0;font-size:14px}

.dd{position:relative}

.htiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.htile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);cursor:pointer;min-height:104px}
.htile .ti{font-size:20px;line-height:1}
.htile .tv{font-family:var(--font-display);font-weight:700;font-size:20px;margin-top:6px}
.htile .tt{font-size:13px;font-weight:600}
.htile .ts{font-size:12px;color:var(--muted)}
.htile.wide{grid-column:1/-1;min-height:0}
.htile.alert{border-color:var(--warn);background:var(--warn-soft)}
.htile:active{transform:scale(.98)}
.ddbtn{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;text-align:start}
.ddback{position:fixed;inset:0;z-index:20}
.ddlist{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:21;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:280px;overflow:auto;padding:4px}
.ddlist button{display:block;width:100%;text-align:start;font:inherit;font-size:15px;padding:9px 10px;border:0;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer}
.ddlist button.on{background:var(--accent-soft);font-weight:700}
.langs{display:flex;gap:2px;border:1px solid var(--line);border-radius:99px;padding:2px}
.lang{border:0;background:transparent;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted)}
.lang.on{background:var(--ink);color:var(--bg)}
.paylines{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted)}
.paylines b{color:var(--ink);font-variant-numeric:tabular-nums}
.row.nowrap{flex-wrap:nowrap}
.status.brk .dot{background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
a.pill{text-decoration:none}
a{color:var(--accent)}
[dir="rtl"] th:first-child,[dir="rtl"] td:first-child{text-align:right}
[dir="rtl"] th,[dir="rtl"] td{text-align:left}
.shift .t{min-width:0}
</style>
</head>

async function scheduleShiftReminder(start,maxH){

    let p=await ln.checkPermissions();if(p.display!=='granted')p=await ln.requestPermissions();if(p.display!=='granted')return;
    const remH=Math.max(1,maxH-2);const now=Date.now();
    await ln.cancel({notifications:[{id:1001},{id:1002}]}).catch(()=>{});
    const list=[];
    if(start+remH*3600000>now+60000)list.push({id:1001,title:'Табель',body:t('notifLong',{h:remH}),schedule:{at:new Date(start+remH*3600000)}});
    if(start+maxH*3600000>now+60000)list.push({id:1002,title:'Табель',body:t('notifForgot',{h:maxH}),schedule:{at:new Date(start+maxH*3600000)}});
    if(list.length)await ln.schedule({notifications:list});

}

function geoPills(s){

    if(k==='end'&&!s.end)return;

    if(site&&isFinite(site.lat)&&isFinite(site.lng)){
      const d=distM(loc,site);const ok=d<=(Number(site.radius)||200)+Math.min(loc.acc||0,300);
      h+=' <a class="pill'+(ok?'':' warn')+'" href="'+mapUrl(loc)+'" target="_blank" rel="noopener">'+lbl+': '+(ok?A('на объекте'):A('далеко, ')+fmtDist(d))+'</a>';
    }else h+=' <a class="pill grey" href="'+mapUrl(loc)+'" target="_blank" rel="noopener">📍 '+lbl+'</a>';
  });
  return h;
}

function buildCsv(){
  const rows=reportRows();const [pa,pb]=periodRange();
  const pcts=[...new Set(rows.flatMap(r=>Object.keys(r.m.buckets).map(Number)).concat([100]))].sort((a,b)=>a-b);
  const q=v=>{const s=String(v==null?'':v);return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const dec=h=>(Math.round(h*100)/100).toFixed(2);
  const out=[];
  out.push([A('Отчёт'),pa+' — '+pb,S.repCompany==='all'?A('Все компании'):companyName(S.repCompany)]);out.push([]);
  out.push(['ID',A('Имя'),A('Компания'),A('Ставка ₪/ч'),A('Часы всего')].concat(pcts.map(p=>A('Часы ')+p+'%')).concat([A('Сверхурочно'),A('За часы ₪'),A('Рабочих дней'),A('Проезд ₪'),A('Доплаты ₪'),A('Вычеты ₪'),A('К выплате ₪')]));
  rows.forEach(({w,m})=>out.push([w.code,w.name,companyName(w.companyId),w.rate||'',dec(m.totalH)].concat(pcts.map(p=>dec(m.buckets[p]||0))).concat([dec(m.otH),Math.round(m.pay),m.travelDays,Math.round(m.travel),Math.round(m.plus),Math.round(m.minus),Math.round(m.total)])));
  out.push([]);out.push([A('Смены по дням')]);
  out.push(['ID',A('Имя'),A('Дата'),A('День'),A('Праздник'),A('Объект'),A('Начало'),A('Конец'),A('Перерыв, мин'),A('Часы за день'),A('Сумма за день ₪'),A('Место начала'),A('Место конца')]);
  rows.forEach(({w,m})=>m.days.slice().reverse().forEach(d=>d.shifts.forEach((s,i)=>{const site=siteOf(s);const x=shiftWork(s);
    const g=k=>{const l=s[k+'Loc'];if(!l)return '';if(site&&isFinite(site.lat)){const dd=distM(l,site);return dd<=(Number(site.radius)||200)+Math.min(l.acc||0,300)?A('на объекте'):A('далеко ')+fmtDist(dd);}return l.lat+','+l.lng;};
    out.push([w.code,w.name,d.key,WDL()[parseDay(d.key).getDay()],d.hol?(d.hol.name||A('праздник')):'',site?site.name:'',clock(s.start),s.end?clock(s.end):A('идёт'),Math.round(x.br/60000),i===0?dec(d.H):'',i===0?Math.round(d.pay):'',g('start'),g('end')]);})));
  const adjRows=rows.flatMap(({w,m})=>m.adj.map(a=>[w.code,w.name,a.date,T.ru[(ADJ_KINDS[a.kind]||{}).key||'kBonus'],a.amount,a.note||'']));
  if(adjRows.length){out.push([]);out.push([A('Доплаты и вычеты')]);out.push(['ID',A('Имя'),A('Дата'),A('Тип'),A('Сумма ₪'),A('Комментарий')]);adjRows.forEach(r=>out.push(r));}
  return '﻿'+out.map(r=>r.map(q).join(',')).join('\r\n');
}
async function shareFile(name,text,mime){
  const P=window.Capacitor&&window.Capacitor.Plugins;const bin=typeof text!=='string';mime=mime||'text/csv';
  if(isNative()){
    if(P&&P.Filesystem&&P.Share){
      try{const r=await P.Filesystem.writeFile(bin?{path:name,data:b64(text),directory:'CACHE'}:{path:name,data:text,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:name,url:r.uri,dialogTitle:A('Отчёт для Excel')});return true;}
      catch(e){if(/cancel/i.test(String(e&&(e.message||e.code)||'')))return true;console.error(e);}
    }
    return false;
  }
  const mobile=/iPhone|iPad|Android/i.test(navigator.userAgent);
  if(mobile){
    try{const f=new File([text],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true;}}
    catch(e){if(e&&e.name==='AbortError')return true;console.error(e);}
  }
  try{const blob=new Blob([text],{type:bin?mime:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);return true;}catch(e){return false;}
}

}

const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
const loadScript=src=>new Promise((ok,no)=>{const x=document.createElement('script');x.src=src;x.onload=ok;x.onerror=()=>no(new Error('load '+src));document.head.appendChild(x);});
async function xlLib(){if(!window.ExcelJS)await loadScript('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js');if(!window.TabelReports)await loadScript('report.js?v=4');return [window.ExcelJS,window.TabelReports];}
const PRESET_JUMBO={norm:9,ot1Hours:24,ot1:125,ot2:125},PRESET_DHL={norm:8.6,ot1Hours:2,ot1:125,ot2:150};
const PRESET_COMPANIES=[['Zara','week'],['Jumbo Ashdod','week',PRESET_JUMBO],['Jumbo Rishon','week',PRESET_JUMBO],['Jumbo Haifa','week',PRESET_JUMBO],['Puda Rishon','week'],['Puda Tel Aviv','week'],['Герцлия','week'],['FedEx','month'],['Logistic Care','month'],['DHL','month',PRESET_DHL,'he'],['Amid','month']];
function presetMissing(){const have=new Set(Object.values(S.companies).map(c=>String(c.name||'').trim().toLowerCase()));return PRESET_COMPANIES.filter(x=>!have.has(x[0].toLowerCase()));}
function xlWorker(wid,from,to){
  const w=S.workers[wid]||{};const m=calc(wid,from,to);const sites={};const c=S.companies[w.companyId]||{};
  const days=m.days.slice().reverse().filter(d=>d.H>=1/60).map(d=>{
    const sh=d.shifts.filter(s=>s.end&&s.end>s.start);const st=Math.min(...sh.map(s=>s.start)),en=Math.max(...sh.map(s=>s.end));const base=parseDay(d.key).getTime();
    sh.forEach(s=>{if(s.siteId)sites[s.siteId]=(sites[s.siteId]||0)+1;});
    const b={b100:0,b125:0,b150:0};const hi=Object.keys(d.buckets).map(Number).filter(p=>p>125);const one=hi.length===1?hi[0]:0;
    Object.keys(d.buckets).forEach(k=>{const p=Number(k),h=d.buckets[k];if(p<=100)b.b100+=h*p/100;else if(p<=125)b.b125+=h*p/125;else b.b150+=one?h:h*p/150;});if(one&&one!==150)b.k150=one/100;
    return Object.assign({date:d.key,in:Math.round((st-base)/60000),out:Math.round((en-base)/60000),brMin:Math.max(0,Math.round((en-st)/60000-d.H*60)),H:d.H,hol:d.hol||null},b);
  });
  const top=Object.keys(sites).sort((a,b)=>sites[b]-sites[a])[0];const site=top&&(c.sites||[]).find(x=>x.id===top);
  const notes=k=>m.adj.filter(a=>k>0?a.amount>=0:a.amount<0).map(a=>a.note).filter(Boolean).join('; ');
  return {code:w.code||'',name:w.name||'?',group:site?site.name:'',rate:Number(w.rate)||0,travel:m.travelRate,travelDays:m.travelDays,travelSum:m.travel,plus:m.plus,plusNote:notes(1),minus:m.minus,minusNote:notes(-1),days};
}
function xlCompanyWorkers(cid,from,to){return sortedWorkers().filter(([,w])=>!isPendingReg(w)&&w.companyId===cid).map(([id])=>xlWorker(id,from,to)).filter(x=>x.days.length||x.plus||x.minus);}
const fileSafe=s=>String(s).replace(/[^\wа-яА-ЯёЁא-ת-]+/g,'_');

let xlBusy=false;
async function doXlsx(kind,cid){
  if(xlBusy)return;xlBusy=true;toast(A("Готовим файл…"));
  try{
    const [EX,R]=await xlLib();const [from,to]=periodRange();let wb,name;
    if(kind==='companies'){
      const rows=scopedCompanies().map(([id,c])=>{const ws=xlCompanyWorkers(id,from,to);const o={company:c.name,payPeriod:c.payPeriod==='week'?'week':'month',workers:ws.filter(x=>x.days.length).length,H:0,h125:0,h150:0,pay:0,travel:0,plus:0,minus:0};
        ws.forEach(x=>{x.days.forEach(d=>{o.H+=d.H;o.h125+=d.b125;o.h150+=d.b150;o.pay+=x.rate*(d.b100+1.25*d.b125+(d.k150||1.5)*d.b150);});o.travel+=x.travelSum||0;o.plus+=x.plus||0;o.minus+=x.minus||0;});return o;});
      wb=R.companies(EX,{lang:'ru',from,to,rows});name='Сводка_по_компаниям_'+periodTag()+'.xlsx';
    }else{
      const c=S.companies[cid];if(!c)throw new Error('no company');const lang=c.lang==='he'?'he':'ru';const ws=xlCompanyWorkers(cid,from,to);
      if(!ws.length){toast(A('За этот период у ')+c.name+A(' нет смен'));return;}
      if(kind==='week'){
        const weeks=[];let k=weekStartOf(from);while(k<=to){const dates=[0,1,2,3,4,5,6].map(i=>addDays(k,i));weeks.push({dates,workers:xlCompanyWorkers(cid,dates[0]<from?from:dates[0],dates[6]>to?to:dates[6])});k=addDays(k,7);}
        wb=R.weekly(EX,{lang,company:c.name,weeks:weeks.filter(w=>w.workers.length)});name=fileSafe(c.name)+'_недели_'+periodTag()+'.xlsx';
      }else{
        wb=R.monthly(EX,{lang,company:c.name,from,to,holidays:Object.fromEntries(Object.entries(S.holidays).filter(([,h])=>holApplies(h,cid))),byWeeks:c.payPeriod==='week',subtitle:lang==='he'?'דוח מאפליקציית «Табель»':'Отчёт из приложения «Табель»',workers:ws});name=fileSafe(c.name)+'_'+periodTag()+'.xlsx';
      }
    }
    const buf=await wb.xlsx.writeBuffer();
    const ok=await shareFile(name,buf,XLSX_MIME);if(!ok)toast(A('Не удалось сохранить файл. Попробуйте на компьютере.'));
  }catch(e){console.error(e);toast(A('Не получилось сделать Excel: ')+(e.message||e));}
  finally{xlBusy=false;}
}

function makeFirebase(M){
  const A=M.auth,F=M.fs;
  const app=M.app.initializeApp(FIREBASE_CONFIG);
  const mkAuth=a=>isNative()?A.initializeAuth(a,{persistence:[A.indexedDBLocalPersistence,A.browserLocalPersistence]}):A.getAuth(a);
  const auth=mkAuth(app);const fdb=isNative()?F.initializeFirestore(app,{experimentalAutoDetectLongPolling:true}):F.getFirestore(app);
  let sec=null;
  return {
    demo:false,
    onAuth(cb){A.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,email:normEmail(u.email)}:null));},
    signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
    async signUp(e,p){const c=await A.createUserWithEmailAndPassword(auth,e,p);return c.user.uid;},
    signOut:()=>A.signOut(auth),
    async createOther(e,p){if(!sec)sec=mkAuth(M.app.initializeApp(FIREBASE_CONFIG,'secondary'));const c=await A.createUserWithEmailAndPassword(sec,e,p);const id=c.user.uid;await A.signOut(sec);return id;},
    reset:e=>A.sendPasswordResetEmail(auth,e),
    async get(col,id){const x=await F.getDoc(F.doc(fdb,col,id));return x.exists()?x.data():null;},
    put:(col,id,d)=>F.setDoc(F.doc(fdb,col,id),d),
    patch:(col,id,d)=>F.updateDoc(F.doc(fdb,col,id),d),
    remove:(col,id)=>F.deleteDoc(F.doc(fdb,col,id)),
    newId:col=>F.doc(F.collection(fdb,col)).id,
    nextCode(){return F.runTransaction(fdb,async tr=>{const ref=F.doc(fdb,'meta','counter');const x=await tr.get(ref);const n=x.exists()?Number(x.data().next)||1:1;if(x.exists())tr.update(ref,{next:n+1});else tr.set(ref,{next:n+1});return String(n).padStart(4,'0');});},
    listen(q,next,err){
      if(q.id)return F.onSnapshot(F.doc(fdb,q.col,q.id),x=>next(x.exists()?{[x.id]:x.data()}:{}),err);
      const ref=F.query(F.collection(fdb,q.col),...(q.where||[]).map(w=>F.where(w[0],w[1],w[2])));
      return F.onSnapshot(ref,x=>{const m={};x.forEach(d=>{m[d.id]=d.data();});next(m);},err);
    }
  };
}
function makeDemo(){
  const D={companies:{},users:{},shifts:{},requests:{},logins:{},meta:{},adjustments:{},audit:{},settings:{}};
  const acc={'admin@demo.ru':{pass:'123456',uid:'demo-admin'}};
  let cur=null;const cbs=[];const subs=new Set();
  const clone=o=>JSON.parse(JSON.stringify(o));
  const fire=()=>setTimeout(()=>subs.forEach(x=>x.run()),0);
  const fail=c=>{const e=new Error(c);e.code=c;return e;};
  const match=(d,w)=>w.every(([f,op,v])=>op==='=='?((d[f]===undefined?null:d[f])===v):op==='in'?v.includes(d[f]):true);
  const emit=()=>setTimeout(()=>cbs.forEach(c=>c(cur)),0);
  window.__demo={D,acc,setUser(e){cur={uid:acc[e].uid,email:e};emit();}};
  return {
    demo:true,
    onAuth(cb){cbs.push(cb);setTimeout(()=>cb(cur),0);},
    async signIn(e,p){const a=acc[e];if(!a||a.pass!==p)throw fail('auth/invalid-credential');cur={uid:a.uid,email:e};emit();},
    async signUp(e,p){if(acc[e])throw fail('auth/email-already-in-use');const id=uid();acc[e]={pass:p,uid:id};cur={uid:id,email:e};emit();return id;},
    async signOut(){cur=null;emit();},
    async createOther(e,p){if(acc[e])throw fail('auth/email-already-in-use');const id=uid();acc[e]={pass:p,uid:id};return id;},
    async reset(){},
    async get(col,id){return D[col][id]?clone(D[col][id]):null;},
    async put(col,id,d){D[col][id]=clone(d);fire();},
    async patch(col,id,d){if(!D[col][id])throw fail('not-found');Object.assign(D[col][id],clone(d));fire();},
    async remove(col,id){delete D[col][id];fire();},
    newId:()=>uid(),
    async nextCode(){const n=(D.meta.counter&&D.meta.counter.next)||1;D.meta.counter={next:n+1};return String(n).padStart(4,'0');},
    listen(q,next){const x={run(){if(q.id){next(D[q.col][q.id]?{[q.id]:clone(D[q.col][q.id])}:{});return;}const m={};for(const k in D[q.col])if(match(D[q.col][k],q.where||[]))m[k]=clone(D[q.col][k]);next(m);}};subs.add(x);setTimeout(()=>x.run(),0);return ()=>subs.delete(x);}
  };
}

let subKey='';
function syncSubs(){
  const r=myRights();const prof=S.workers[S.uid]||(SRC.users.me&&SRC.users.me[S.uid]);
  const active=!!prof&&prof.status==='active'&&prof.active!==false;
  const months=new Set([S.month]);if(r){const [a,b]=periodRange();monthsBetween(a,b).forEach(m=>months.add(m));}
  const ms=[...months].sort();
  const key=JSON.stringify([S.uid,ms,r&&r.all,r&&r.set?[...r.set].sort():null,active]);
  if(key===subKey)return;subKey=key;
  dataUnsubs.forEach(u=>u());dataUnsubs=[];
  ['shifts','requests','adj','audit'].forEach(k=>{SRC[k]={};});Object.keys(SRC.users).forEach(k=>{if(k!=='me')delete SRC.users[k];});
  mergeSrc();
  if(!S.uid)return;
  listen('hol','hol',{col:'settings',id:'holidays'});
  if(r&&r.all){
    listen('users','all',{col:'users'});listen('requests','all',{col:'requests'});
    listen('shifts','oAll',{col:'shifts',where:[['end','==',null]]});
    ms.forEach(m=>{listen('shifts','m'+m,{col:'shifts',where:[['month','==',m]]});listen('adj','m'+m,{col:'adjustments',where:[['month','==',m]]});listen('audit','m'+m,{col:'audit',where:[['month','==',m]]});});
  }else if(r&&r.set&&r.set.size){
    const ids=[...r.set].slice(0,30);
    listen('users','mine',{col:'users',where:[['companyId','in',ids]]});listen('requests','co',{col:'requests',where:[['companyId','in',ids]]});
    listen('shifts','oCo',{col:'shifts',where:[['companyId','in',ids],['end','==',null]]});
    ms.forEach(m=>{listen('shifts','c'+m,{col:'shifts',where:[['companyId','in',ids],['month','==',m]]});listen('adj','c'+m,{col:'adjustments',where:[['companyId','in',ids],['month','==',m]]});listen('audit','c'+m,{col:'audit',where:[['companyId','in',ids],['month','==',m]]});});
  }
  if(active){
    listen('shifts','oMe',{col:'shifts',where:[['workerId','==',S.uid],['end','==',null]]});listen('requests','me',{col:'requests',where:[['workerId','==',S.uid]]});
    ms.forEach(m=>{listen('shifts','me'+m,{col:'shifts',where:[['workerId','==',S.uid],['month','==',m]]});listen('adj','me'+m,{col:'adjustments',where:[['workerId','==',S.uid],['month','==',m]]});});
  }
}
async function createProfile(p,owner){
  if(S.creating)return false;S.creating=true;render();
  try{
    const code=await B.nextCode();const authEmail=S.email;
    const data={code,name:p.name,phone:p.phone||'',email:p.email||'',authEmail,companyId:p.companyId||'',rate:0,travel:0,role:owner?'super':'worker',manages:[],status:owner?'active':'pending',active:!!owner,createdAt:Date.now()};
    await B.put('users',S.uid,data);await B.put('logins','c_'+code,{email:authEmail,uid:S.uid});
    if(p.phone)await B.put('logins','p_'+normPhone(p.phone),{email:authEmail,uid:S.uid});
    return true;
  }catch(e){console.error(e);S.error=A('Не удалось сохранить профиль: ')+(e.code||e.message);return false;}
  finally{S.creating=false;S.pendingProfile=null;render();}
}
function onAuthUser(u){
  if(meUnsub){meUnsub();meUnsub=null;}
  SRC.users={};S.profileLoaded=false;S.asAdminPreview=false;
  S.uid=u?u.uid:null;S.email=u?u.email:'';S.me=S.uid;S.month=monthKey(new Date());S.tab='home';S.repWorker=null;S.repCompany='all';
  subKey='';syncSubs();
  if(!u){S.view='start';render();return;}
  let first=true;
  meUnsub=B.listen({col:'users',id:u.uid},m=>{
    SRC.users.me=m;mergeSrc();S.profileLoaded=true;
    const prof=m[u.uid];
    if(!prof&&!S.creating){if(S.pendingProfile)createProfile(S.pendingProfile,isOwnerEmail());else if(isOwnerEmail())createProfile({name:A('Главный админ'),email:S.email},true);}
    if(first&&prof){first=false;S.view=(myRights()?'admin':'worker');}
    syncSubs();render();
  },e=>{S.profileLoaded=true;S.error=A('Ошибка загрузки профиля: ')+(e.message||e.code);render();});
}

/* ---------- start ---------- */
const BUILD='20261111141700';
async function checkUpdate(){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();if(j.v&&j.v!==BUILD&&!location.search.includes('v='+j.v))location.replace(location.pathname+'?v='+encodeURIComponent(j.v)+location.hash);}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate();});
async function init(){
  checkUpdate();
  render();
  const slowT=setTimeout(()=>{if(!S.ready){S.slow=true;render();}},10000);
  if(FIREBASE_CONFIG){
    try{const [app,auth,fs]=await Promise.all([import(FB_SDK+'firebase-app.js'),import(FB_SDK+'firebase-auth.js'),import(FB_SDK+'firebase-firestore.js')]);B=makeFirebase({app,auth,fs});}
    catch(e){S.error=A('Не удалось загрузить сайт. Проверьте интернет и обновите страницу.');S.ready=true;render();return;}
  }else{B=makeDemo();S.demo=true;OWNER_EMAILS.push('admin@demo.ru');}
  let gotCo=false,gotAuth=false;
  const done=()=>{if(gotCo&&gotAuth&&!S.ready){S.ready=true;S.slow=false;clearTimeout(slowT);}render();};
  B.listen({col:'companies'},m=>{S.companies=m;gotCo=true;done();},e=>{S.error=A('Ошибка загрузки: ')+(e.message||e.code);gotCo=true;done();});
  B.onAuth(u=>{onAuthUser(u);gotAuth=true;done();});
}
init();
})();
</script>
